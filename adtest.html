<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 테스트 10개</title>
<body style="font-family:system-ui;margin:16px">
<h3>우리 앱과 같은 방식의 유튜브 플레이어 10개 — 하나씩 ▶ 눌러 광고 확인</h3>
<div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>
<script>
const V = [
  ['dQw4w9WgXcQ', 'Rick Astley - Never Gonna Give You Up'],
  ['9bZkp7q19f0', 'PSY - Gangnam Style'],
  ['kJQP7kiw5Fk', 'Luis Fonsi - Despacito'],
  ['JGwWNGJdvx8', 'Ed Sheeran - Shape of You'],
  ['OPf0YbXqDm0', 'Mark Ronson - Uptown Funk'],
  ['RgKAFK5djSk', 'Wiz Khalifa - See You Again'],
  ['fJ9rUzIMcZQ', 'Queen - Bohemian Rhapsody'],
  ['iG9CE55wbtY', 'TED - Ken Robinson'],
  ['UF8uR6Z6KLc', 'Steve Jobs Stanford 연설'],
  ['arj7oStGLkU', 'TED - Tim Urban'],
];
V.forEach(([id, t], i) => g.insertAdjacentHTML('beforeend',
  `<div><b>${i + 1}. ${t}</b><div style="aspect-ratio:16/9;margin-top:6px"><div id="p${i}"></div></div></div>`));
function onYouTubeIframeAPIReady() {
  V.forEach(([id], i) => new YT.Player('p' + i, { videoId: id, width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, origin: location.origin, start: 0 } }));
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
