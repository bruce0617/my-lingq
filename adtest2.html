<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 테스트 2</title>
<body style="font-family:system-ui;margin:16px">
<h3>같은 영상(Cleo Abram)을 방식만 바꿔 5개 — 각각 ▶ 눌러 광고 확인</h3>
<div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>
<script>
const ID = 'Mflnmsu225U', O = encodeURIComponent(location.origin);
const ALLOW = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
const box = (n, t, html) => g.insertAdjacentHTML('beforeend', `<div><b>${n}. ${t}</b><div style="aspect-ratio:16/9;margin-top:6px">${html}</div></div>`);
const ifr = (src, rp = 'strict-origin-when-cross-origin') => `<iframe width="100%" height="100%" frameborder="0" allowfullscreen allow="${ALLOW}" referrerpolicy="${rp}" src="${src}"></iframe>`;
box(1, '지금 우리 앱 방식 (API)', '<div id="api"></div>');
box(2, 'LingQ와 똑같은 iframe', ifr(`https://www.youtube.com/embed/${ID}?autoplay=0&modestbranding=1&rel=0&disablekb=1&enablejsapi=1&origin=${O}`));
box(3, '주소 숨김 (no-referrer)', ifr(`https://www.youtube.com/embed/${ID}?modestbranding=1&rel=0&playsinline=1`, 'no-referrer'));
box(4, '개인정보 보호 모드 (nocookie)', ifr(`https://www.youtube-nocookie.com/embed/${ID}?modestbranding=1&rel=0&playsinline=1`));
box(5, '기본 iframe (설정 없음)', ifr(`https://www.youtube.com/embed/${ID}`));
function onYouTubeIframeAPIReady() {
  new YT.Player('api', { videoId: ID, width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, origin: location.origin, start: 0 } });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
