<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 테스트 3</title>
<body style="font-family:system-ui;margin:16px">
<h3>아이패드 광고 확인 — 같은 영상(Cleo Abram), 방식 4가지</h3>
<p id="ua" style="font-size:12px;color:#888"></p>
<div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px"></div>
<script>
ua.textContent = navigator.userAgent;
const ID = 'Mflnmsu225U';
const ALLOW = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
const box = (n, t, html) => g.insertAdjacentHTML('beforeend', `<div><b>${n}. ${t}</b><div style="aspect-ratio:16/9;margin-top:6px">${html}</div></div>`);
const ifr = (src, rp = 'strict-origin-when-cross-origin') => `<iframe width="100%" height="100%" frameborder="0" allowfullscreen allow="${ALLOW}" referrerpolicy="${rp}" src="${src}"></iframe>`;
box('A', '지금 앱 방식 (API + nocookie)', '<div id="api"></div>');
box('B', 'nocookie 기본 iframe (아이폰에서 광고 없던 4번)', ifr(`https://www.youtube-nocookie.com/embed/${ID}?modestbranding=1&rel=0&playsinline=1`));
box('C', 'nocookie + 주소 숨김', ifr(`https://www.youtube-nocookie.com/embed/${ID}?rel=0&playsinline=1`, 'no-referrer'));
box('D', '일반 youtube.com (비교용)', ifr(`https://www.youtube.com/embed/${ID}?rel=0&playsinline=1`));
function onYouTubeIframeAPIReady() {
  new YT.Player('api', { host: 'https://www.youtube-nocookie.com', videoId: ID, width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, origin: location.origin, start: 0 } });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
